# Free Schoolrun 后端站点配置（Nginx，方案 B）
#
# 安装：
#   sudo cp deploy/nginx/schoolrun-backend.conf /etc/nginx/sites-available/freeschoolrun
#   sudo sed -i 's/app.example.com/你的域名/g' /etc/nginx/sites-available/freeschoolrun
#   sudo ln -sf /etc/nginx/sites-available/freeschoolrun /etc/nginx/sites-enabled/freeschoolrun
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d 你的域名      # 自动签证书并加 80→443 跳转
#
# 说明：本文件假设后端在本机 127.0.0.1:8000（见 deploy/systemd/schoolrun-backend.service）

server {
    listen 80;
    listen [::]:80;
    server_name app.example.com;

    # 证书首次签发走 webroot
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    # 允许管理端上传 APK
    client_max_body_size 400m;

    # APK 下载：/dl/<文件名> → 后端 releases 目录
    location /dl/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 其余全部转发给后端（含 /api/**、/admin、/docs）
    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }
}
